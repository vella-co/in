
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG ELITE | Tournament Upcoming</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
    radial-gradient(circle at 50% 45%, #38290d 0%, transparent 35%),
    linear-gradient(135deg, #080808, #11100c, #030303);
    z-index: -2;
}

.grid {
    position: fixed;
    inset: 0;
    background-image:
    linear-gradient(#d6a6420c 1px, transparent 1px),
    linear-gradient(90deg, #d6a6420c 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(transparent, black, transparent);
    z-index: -1;
}

/* Main Card */
.container {
    width: 90%;
    max-width: 850px;
    padding: 65px 20px;
    text-align: center;
    border: 1px solid #b58b36;
    background: linear-gradient(145deg, #14120d, #080808 60%);
    box-shadow: 0 0 50px #c99a3520,
                inset 0 0 35px #c99a3510;
    position: relative;
}

.container::before,
.container::after {
    content: "";
    position: absolute;
    width: 45px;
    height: 45px;
    border-color: #e6bd62;
    border-style: solid;
}

.container::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.container::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

.tag {
    color: #cba34e;
    letter-spacing: 6px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 28px;
}

.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(35px, 8vw, 75px);
    font-weight: 900;
    color: #f5d58a;
    text-shadow: 0 0 20px #c18b36;
    letter-spacing: 2px;
}

.line {
    width: 130px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e5bd65, transparent);
    margin: 25px auto;
}

.heading {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: 5px;
    color: #ffffff;
}

.heading span {
    color: #e6b957;
}

.subtitle {
    margin-top: 18px;
    color: #999;
    font-size: 17px;
    letter-spacing: 3px;
}

.status {
    display: inline-block;
    margin-top: 35px;
    padding: 12px 30px;
    border: 1px solid #c99b44;
    color: #eac56d;
    letter-spacing: 4px;
    font-weight: 700;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        box-shadow: 0 0 5px #c99b4440;
    }
    50% {
        box-shadow: 0 0 25px #c99b4480;
    }
}

.footer {
    margin-top: 45px;
    font-size: 12px;
    color: #777;
    letter-spacing: 4px;
}

@media(max-width: 500px) {
    .container {
        padding: 55px 12px;
    }

    .tag {
        letter-spacing: 3px;
    }

    .heading {
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="container">

    <div class="tag">OFFICIAL ESPORTS EVENT</div>

    <div class="logo">ᏚᏩ_Ꭼʟɪᴛᴇ</div>

    <div class="line"></div>

    <div class="heading">
        TOURNAMENT <span>UPCOMING</span>
    </div>

    <div class="subtitle">
        THE BATTLE IS ABOUT TO BEGIN
    </div>

    <div class="status">
        ● COMING SOON
    </div>

    <div class="footer">
        SG ELITE ESPORTS © 2026
    </div>

</div>

</body>
</html>
